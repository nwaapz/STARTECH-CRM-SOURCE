openapi: 3.0.3
info:
  title: Gateway LAN CRM API
  version: 1.0.0
  description: HTTP API served from the Android SMS gateway over hotspot LAN.

paths:
  /api/health:
    get:
      summary: Health check (no auth)
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/sync:
    get:
      summary: Poll for stats and change events
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        "200":
          description: Sync payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "401":
          description: Invalid PIN

  /api/serials/batch:
    post:
      summary: Bulk-create serial numbers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRequest"
      responses:
        "200":
          description: Batch result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponse"
        "400":
          description: Validation error
        "401":
          description: Invalid PIN
        "409":
          description: Duplicate serials in requested range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateSerialError"

  /api/serials/complex-batch:
    post:
      summary: Create unique random serials with configurable length and character mix
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplexBatchRequest"
      responses:
        "200":
          description: Batch result (skipped = collisions avoided while filling requested count)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponse"
        "400":
          description: Validation error
        "401":
          description: Invalid PIN

  /api/serials/import-batch:
    post:
      summary: Import serials from an external list (e.g. first Excel column)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportBatchRequest"
      responses:
        "200":
          description: Import result (skipped = duplicates in file or already existing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponse"
        "400":
          description: Validation error
        "401":
          description: Invalid PIN

  /api/serials/import-csv:
    post:
      summary: Import serials with registration state from a named-header CSV (LAN gateway only)
      description: |
        Served by the Android LAN hotspot API (local Room DB). Not available on remote CRM PHP.
        Multipart upload. One CSV file becomes one serial group (`generation_mode=import`).
        Required header: `serial`. Optional: `phone`, `date` (alias `date_jalali`), `city`, `km`.
        Unused inventory = blank/`0` phone and empty date. Registered = real phone + optional Jalali date.
        Max 750000 data rows per request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportCsvMultipart"
      responses:
        "200":
          description: Import result including used/unused inserted counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCsvResponse"
        "400":
          description: Validation error (missing serial header, no rows, etc.)
        "401":
          description: Invalid PIN

  /api/serial-groups:
    get:
      summary: List serial generation groups with usage stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Serial group list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialGroupListResponse"
        "401":
          description: Invalid PIN

  /api/serial-groups/{id}:
    put:
      summary: Update serial group description, score, and category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSerialGroupRequest"
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialGroup"
        "400":
          description: Validation error
        "401":
          description: Invalid PIN
        "404":
          description: Group not found
    delete:
      summary: Delete a serial group and all its serials
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Group deleted
        "400":
          description: Invalid group id
        "401":
          description: Invalid PIN
        "404":
          description: Group not found

  /api/serial-groups/{id}/serials:
    get:
      summary: List serial values for a generation group
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Serial values in the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialGroupSerialsResponse"
        "400":
          description: Invalid group id
        "401":
          description: Invalid PIN
        "404":
          description: Group not found

  /api/serial-groups/{id}/extend:
    post:
      summary: Extend a serial group range upward and/or downward
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendSerialGroupRangeRequest"
      responses:
        "200":
          description: Range extended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtendSerialGroupRangeResponse"
        "400":
          description: Validation error
        "401":
          description: Invalid PIN
        "404":
          description: Group not found
        "409":
          description: Duplicate serials in extension range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateSerialError"

  /api/serials:
    get:
      summary: List serials with filters
      security:
        - bearerAuth: []
      parameters:
        - name: registered
          in: query
          schema:
            type: boolean
        - name: from
          in: query
          schema:
            type: string
            description: Jalali datetime lower bound (e.g. 1404/03/01)
        - name: to
          in: query
          schema:
            type: string
            description: Jalali datetime upper bound
        - name: search
          in: query
          schema:
            type: string
        - name: source
          in: query
          description: Registration channel filter; repeat or comma-separate (sms, rubika, telegram). Empty = all.
          schema:
            type: string
            enum: [sms, rubika, telegram, bale]
          style: form
          explode: true
        - name: category
          in: query
          description: Serial group customer type; repeat or comma-separate (end_user_client, seller_to_end_user). Empty = all.
          schema:
            type: string
            enum: [end_user_client, seller_to_end_user]
          style: form
          explode: true
        - name: groupIds
          in: query
          description: Restrict to serials from these generation groups; repeat or comma-separate. Empty = all groups.
          schema:
            type: integer
            format: int64
          style: form
          explode: true
        - name: provinceId
          in: query
          description: Iran province id; when set, only serials whose city matches that province are returned
          schema:
            type: string
        - name: cityName
          in: query
          description: City name within the selected province (optional narrower filter)
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated serial list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialListResponse"
        "401":
          description: Invalid PIN

  /api/serials/{id}:
    put:
      summary: Update registered serial row (admin edit)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSerialRegistrationRequest"
      responses:
        "200":
          description: Updated serial row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialRow"
        "400":
          description: Validation error or serial not registered
        "404":
          description: Serial not found
        "409":
          description: Duplicate serial value

  /api/communications:
    get:
      summary: Paginated SMS communication log
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [incoming, outgoing]
          description: Filter by message direction (omit for all)
        - name: phone
          in: query
          required: false
          schema:
            type: string
          description: Partial phone prefix search (e.g. 0913)
      responses:
        "200":
          description: Paginated message list (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationListResponse"
        "401":
          description: Invalid PIN

  /api/communications/thread:
    get:
      summary: Messages for one phone number (oldest-first batch)
      security:
        - bearerAuth: []
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            type: string
        - name: before
          in: query
          required: false
          schema:
            type: integer
            format: int64
            description: Load messages older than this timestamp
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Thread batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationThreadResponse"
        "400":
          description: Missing phone
        "401":
          description: Invalid PIN

  /api/communications/send:
    post:
      summary: Send a free-text message to one phone through one or more tunnels
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunicationSendRequest"
      responses:
        "200":
          description: Per-channel send results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationSendResponse"
        "400":
          description: Validation error
        "401":
          description: Invalid PIN

  /api/settings/sms-processing:
    get:
      summary: Get SMS processing settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SMS processing configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsProcessingSettings"
        "401":
          description: Invalid PIN
    put:
      summary: Update SMS processing settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsProcessingSettings"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsProcessingSettings"
        "400":
          description: Validation error
        "401":
          description: Invalid PIN

  /api/settings/sim-quota:
    get:
      summary: Get per-SIM daily SMS quota settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SIM quota settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimQuotaSettings"
        "401":
          description: Invalid PIN
    put:
      summary: Update per-SIM daily SMS quota settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimQuotaSettings"
      responses:
        "200":
          description: Updated SIM quota settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimQuotaSettings"
        "400":
          description: Validation error
        "401":
          description: Invalid PIN

  /api/settings/sms-messages:
    get:
      summary: Get customer SMS message templates
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Message template catalog with current text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsMessagesSettings"
        "401":
          description: Invalid PIN
    put:
      summary: Update customer SMS message templates
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsMessagesSettings"
      responses:
        "200":
          description: Updated message templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsMessagesSettings"
        "400":
          description: Validation error
        "401":
          description: Invalid PIN

  /api/rubika/status:
    get:
      summary: Get Rubika bot connection status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RubikaStatus"
        "401":
          description: Invalid PIN

  /api/rubika/connect:
    post:
      summary: Connect and verify Rubika bot token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RubikaConnectRequest"
      responses:
        "200":
          description: Connected bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RubikaStatus"
        "400":
          description: Invalid token or connect failed
        "401":
          description: Invalid PIN

  /api/rubika/disconnect:
    post:
      summary: Disconnect Rubika bot
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Disconnected bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RubikaStatus"
        "401":
          description: Invalid PIN

  /api/rubika/messages:
    get:
      summary: List Rubika messages
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          schema:
            type: integer
            format: int64
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 200
      responses:
        "200":
          description: Rubika message list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RubikaMessageListResponse"
        "401":
          description: Invalid PIN

  /api/settings/rubika:
    get:
      summary: Get Rubika serial processing settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Rubika settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RubikaSettings"
        "401":
          description: Invalid PIN
    put:
      summary: Update Rubika serial processing settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RubikaSettings"
      responses:
        "200":
          description: Updated Rubika settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RubikaSettings"
        "401":
          description: Invalid PIN

  /api/telegram/status:
    get:
      summary: Get Telegram bot connection status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramStatus"
        "401":
          description: Invalid PIN

  /api/telegram/connect:
    post:
      summary: Connect and verify Telegram bot token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramConnectRequest"
      responses:
        "200":
          description: Connected bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramStatus"
        "400":
          description: Invalid token or connect failed
        "401":
          description: Invalid PIN

  /api/telegram/disconnect:
    post:
      summary: Disconnect Telegram bot
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Disconnected bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramStatus"
        "401":
          description: Invalid PIN

  /api/telegram/messages:
    get:
      summary: List Telegram messages
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          schema:
            type: integer
            format: int64
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 200
      responses:
        "200":
          description: Telegram message list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramMessageListResponse"
        "401":
          description: Invalid PIN

  /api/settings/telegram:
    get:
      summary: Get Telegram serial processing settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Telegram settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramSettings"
        "401":
          description: Invalid PIN
    put:
      summary: Update Telegram serial processing settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramSettings"
      responses:
        "200":
          description: Updated Telegram settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramSettings"
        "401":
          description: Invalid PIN


  /api/bale/status:
    get:
      summary: Get Bale bot connection status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaleStatus"
        "401":
          description: Invalid PIN

  /api/bale/connect:
    post:
      summary: Connect and verify Bale bot token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaleConnectRequest"
      responses:
        "200":
          description: Connected bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaleStatus"
        "400":
          description: Invalid token or connect failed
        "401":
          description: Invalid PIN

  /api/bale/disconnect:
    post:
      summary: Disconnect Bale bot
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Disconnected bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaleStatus"
        "401":
          description: Invalid PIN

  /api/bale/messages:
    get:
      summary: List Bale messages
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          schema:
            type: integer
            format: int64
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 200
      responses:
        "200":
          description: Bale message list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaleMessageListResponse"
        "401":
          description: Invalid PIN

  /api/settings/bale:
    get:
      summary: Get Bale bot settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bale settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaleSettings"
        "401":
          description: Invalid PIN
    put:
      summary: Update Bale bot settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaleSettings"
      responses:
        "200":
          description: Updated Bale settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaleSettings"
        "401":
          description: Invalid PIN

  /api/mass-sms/provinces:
    get:
      summary: List Iran provinces and cities for mass SMS filters
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Province list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IranProvinceListResponse"
        "401":
          description: Invalid PIN


  /api/mass-sms/preview:
    post:
      summary: Preview mass SMS recipient count
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MassSmsPreviewRequest"
      responses:
        "200":
          description: Preview result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MassSmsPreviewResponse"
        "400":
          description: Validation error
        "401":
          description: Invalid PIN


  /api/mass-sms/campaigns:
    get:
      summary: List mass SMS campaigns
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Campaign list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MassSmsCampaignListResponse"
        "401":
          description: Invalid PIN
    post:
      summary: Create a mass SMS campaign
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MassSmsCreateRequest"
      responses:
        "200":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MassSmsCampaign"
        "400":
          description: Validation error
        "401":
          description: Invalid PIN

  /api/mass-sms/media:
    post:
      summary: Upload a media asset (image/file) for bot mass campaigns
      description: >
        Uploads a single file once and stores it as a reusable media asset. The returned
        assetId is passed to campaign creation; the app caches a per-platform file_id on
        first send so subsequent sends do not re-upload.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Stored media asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MassSmsMediaResponse"
        "400":
          description: No file provided
        "401":
          description: Invalid PIN


  /api/mass-sms/campaigns/{id}:
    get:
      summary: Get mass SMS campaign detail with recipients
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Campaign detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MassSmsCampaignDetailResponse"
        "401":
          description: Invalid PIN
        "404":
          description: Campaign not found
    delete:
      summary: Delete a mass SMS campaign
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Deleted
        "401":
          description: Invalid PIN
        "404":
          description: Campaign not found


  /api/mass-sms/campaigns/{id}/pause:
    post:
      summary: Pause a running mass SMS campaign
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Paused campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MassSmsCampaign"
        "401":
          description: Invalid PIN
        "404":
          description: Campaign not found


  /api/mass-sms/campaigns/{id}/resume:
    post:
      summary: Resume a paused mass SMS campaign
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Resumed campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MassSmsCampaign"
        "401":
          description: Invalid PIN
        "404":
          description: Campaign not found

  /api/club-auto-messages:
    get:
      summary: List customer-club scheduled auto-message rules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Rule list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubAutoMessageRuleListResponse"
        "401":
          description: Invalid PIN
    post:
      summary: Create a customer-club auto-message rule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClubAutoMessageUpsertRequest"
      responses:
        "200":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubAutoMessageRule"
        "400":
          description: Validation error
        "401":
          description: Invalid PIN

  /api/club-auto-messages/{id}:
    put:
      summary: Update a customer-club auto-message rule
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClubAutoMessageUpsertRequest"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubAutoMessageRule"
        "400":
          description: Validation error
        "401":
          description: Invalid PIN
        "404":
          description: Rule not found
    delete:
      summary: Delete a customer-club auto-message rule
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Deleted
        "401":
          description: Invalid PIN
        "404":
          description: Rule not found

  /api/club-auto-messages/{id}/run-now:
    post:
      summary: Run a club auto-message rule immediately (test)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Rule after run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubAutoMessageRule"
        "400":
          description: Validation error
        "401":
          description: Invalid PIN
        "404":
          description: Rule not found

  /api/club-auto-messages/tick:
    post:
      summary: Nudge the gateway to process any due club auto-message rules now
      description: >
        Starts the scheduler if needed and triggers an immediate due-rule check.
        Returns immediately; poll GET /api/club-auto-messages for runStatus progress.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Nudge accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          description: Invalid PIN

  /api/club-auto-messages/{id}/preview:
    get:
      summary: Preview upcoming recipients before the next send
      description: >
        Lists phones eligible for this rule (registration on or before cutoff),
        with per-channel status: pending, already_sent, no_chat, or no_token.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Paginated preview of eligible recipients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubAutoMessagePreviewResponse"
        "400":
          description: Validation error
        "401":
          description: Invalid PIN
        "404":
          description: Rule not found

  /api/club-auto-messages/{id}/sends:
    get:
      summary: List permanent recipients for a club auto-message rule
      description: >
        Each successful send is stored permanently (rule + phone + channel).
        Recipients who already appear here are never sent the same rule again on that channel.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Paginated send ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubAutoMessageSendListResponse"
        "401":
          description: Invalid PIN
        "404":
          description: Rule not found

  /api/auth/login:
    post:
      summary: CRM username/password login (returns Bearer session token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Session token
        "401":
          description: Invalid credentials

  /api/lottery/participants:
    get:
      summary: Lottery pool (positive scores)
      security:
        - bearerAuth: []
      parameters:
        - name: city
          in: query
          schema: { type: string }
        - name: phone
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Participants

  /api/lottery/draw:
    post:
      summary: Weighted random draw (Jalali scores)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Drawn participant

  /api/lottery/confirm:
    post:
      summary: Confirm winner and zero score
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Winner row

  /api/stats/registrations-by-day:
    get:
      summary: Daily registration counts (Jalali from/to, Latin YYYY/MM/DD)
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          description: Jalali YYYY/MM/DD (default first day of current Jalali month)
          schema: { type: string }
        - name: to
          in: query
          description: Jalali YYYY/MM/DD (default last day of current Jalali month)
          schema: { type: string }
      responses:
        "200":
          description: Zero-filled day series

  /api/admin/users:
    get:
      summary: List CRM users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users
    post:
      summary: Create CRM user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Created

  /api/admin/sync-status:
    get:
      summary: Dual-buffer cloud sync health (pending local buffer, conflicts on device)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Status including pendingOutbox and conflictCount

  /api/sync/buffer:
    get:
      summary: List remote pending change-buffer entries (device sync token)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending buffer entries
        "401":
          description: Unauthorized

  /api/sync/buffer/apply:
    post:
      summary: Apply phone buffer entries onto remote DB (device sync token)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Applied count
        "401":
          description: Unauthorized

  /api/sync/buffer/ack:
    post:
      summary: Acknowledge remote buffer entries applied on phone (device sync token)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Acked count
        "401":
          description: Unauthorized

  /api/sync/buffer/backfill:
    post:
      summary: >-
        Catch-up step (device sync token): re-enqueue the most recently
        registered serials as pending buffer entries (count-based, up to
        5000; not date-based) so a phone/LAN web that's behind — e.g. after
        loading a stale CSV/backup — can pull them via the normal
        buffer/apply/ack flow. Not called on its own; it is the first step
        of the "Get from server" action (Android + LAN CRM web).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Number of rows enqueued
        "401":
          description: Unauthorized

  /api/sync/manifest:
    get:
      summary: Retired — returns 410 Gone (use buffer endpoints)
      security:
        - bearerAuth: []
      responses:
        "410":
          description: Gone

  /api/sync/pull/group:
    get:
      summary: Retired — returns 410 Gone (use buffer endpoints)
      security:
        - bearerAuth: []
      responses:
        "410":
          description: Gone

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        version:
          type: string
        serverTime:
          type: integer
          format: int64

    Stats:
      type: object
      properties:
        total:
          type: integer
        unused:
          type: integer
        registered:
          type: integer

    SyncChange:
      type: object
      properties:
        type:
          type: string
          enum: [registered, serials_added]
        serial:
          type: string
        phone:
          type: string
        date:
          type: string
        city:
          type: string
        km:
          type: integer
        inserted:
          type: integer
        skipped:
          type: integer
        total:
          type: integer
        at:
          type: integer
          format: int64

    SyncResponse:
      type: object
      properties:
        serverTime:
          type: integer
          format: int64
        cursor:
          type: integer
          format: int64
        stats:
          $ref: "#/components/schemas/Stats"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SyncChange"
        sims:
          type: array
          items:
            $ref: "#/components/schemas/SimQuotaStatus"

    SimQuotaStatus:
      type: object
      required: [label, subscriptionId, role, sent, limit, remaining]
      properties:
        label:
          type: string
        subscriptionId:
          type: integer
        role:
          type: string
          enum: [primary, backup]
        sent:
          type: integer
        limit:
          type: integer
        remaining:
          type: integer

    SimQuotaSettings:
      type: object
      required: [dailyLimit, backupSimsEnabled]
      properties:
        dailyLimit:
          type: integer
          minimum: 1
          maximum: 100000
          default: 300
        backupSimsEnabled:
          type: boolean
          default: false

    BatchRequest:
      type: object
      required: [prefix, start, end]
      properties:
        prefix:
          type: string
          description: Letter/digit prefix; case-insensitive (stored uppercase)
        start:
          type: integer
        end:
          type: integer
        padWidth:
          type: integer
          default: 0
        city:
          type: string
        km:
          type: integer
        description:
          type: string
        score:
          type: integer
          default: 1
          minimum: 1
          description: Lottery weight for this product group
        category:
          type: string
          enum: [end_user_client, seller_to_end_user]
          default: end_user_client
          description: Whether serials are for end-user clients or sellers to end users
        warrantyMonths:
          type: integer
          nullable: true
          minimum: 1
          description: Warranty duration in months after registration (at least one of months/km required)
        warrantyKm:
          type: integer
          nullable: true
          minimum: 1
          description: Warranty mileage limit in km (at least one of months/km required)

    ComplexBatchRequest:
      type: object
      required: [count, letterCount, digitCount]
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 10000
          description: Exact number of unique serials to create
        letterCount:
          type: integer
          minimum: 0
          maximum: 32
          description: Exact number of letter characters per serial (random positions)
        digitCount:
          type: integer
          minimum: 0
          maximum: 32
          description: Exact number of digit characters per serial
        pattern:
          type: string
          nullable: true
          description: >
            Optional fixed body pattern using C (letter) and D (digit), e.g. CDDDDDDD.
            When omitted, letter positions are shuffled randomly within the body.
        city:
          type: string
        km:
          type: integer
        description:
          type: string
        score:
          type: integer
          default: 1
          minimum: 1
        category:
          type: string
          enum: [end_user_client, seller_to_end_user]
          default: end_user_client
        warrantyMonths:
          type: integer
          nullable: true
          minimum: 1
        warrantyKm:
          type: integer
          nullable: true
          minimum: 1

    ImportBatchRequest:
      type: object
      required: [serials]
      properties:
        serials:
          type: array
          items:
            type: string
          maxItems: 500000
          description: Serial values (typically first column of an Excel file)
        city:
          type: string
        km:
          type: integer
        description:
          type: string
        score:
          type: integer
          default: 1
          minimum: 1
        category:
          type: string
          enum: [end_user_client, seller_to_end_user]
          default: end_user_client
        warrantyMonths:
          type: integer
          nullable: true
          minimum: 1
        warrantyKm:
          type: integer
          nullable: true
          minimum: 1
        imageVerificationRequired:
          type: boolean
          default: false

    ImportCsvMultipart:
      type: object
      required: [file, score, category]
      properties:
        file:
          type: string
          format: binary
          description: UTF-8 CSV with header row (serial,phone,date,city,km)
        description:
          type: string
        score:
          type: integer
          default: 1
          minimum: 1
        category:
          type: string
          enum: [end_user_client, seller_to_end_user]
          default: end_user_client
        warrantyMonths:
          type: integer
          nullable: true
          minimum: 1
        warrantyKm:
          type: integer
          nullable: true
          minimum: 1
        imageVerificationRequired:
          type: boolean
          default: false

    BatchResponse:
      type: object
      properties:
        inserted:
          type: integer
        skipped:
          type: integer
        total:
          type: integer
        groupId:
          type: integer
          format: int64
          nullable: true

    ImportCsvResponse:
      allOf:
        - $ref: "#/components/schemas/BatchResponse"
        - type: object
          properties:
            usedInserted:
              type: integer
              description: Inserted rows with a registered phone
            unusedInserted:
              type: integer
              description: Inserted rows treated as unused inventory
            invalidCount:
              type: integer
              description: Rows skipped for invalid serial format

    SerialGroup:
      type: object
      properties:
        id:
          type: integer
          format: int64
        prefix:
          type: string
        startNumber:
          type: integer
        endNumber:
          type: integer
        padWidth:
          type: integer
        rangeLabel:
          type: string
        description:
          type: string
          nullable: true
        score:
          type: integer
        category:
          type: string
          enum: [end_user_client, seller_to_end_user]
        generationMode:
          type: string
          enum: [range, complex, import]
          default: range
        warrantyMonths:
          type: integer
          nullable: true
        warrantyKm:
          type: integer
          nullable: true
        total:
          type: integer
        used:
          type: integer
        unused:
          type: integer
        salePercentage:
          type: number
          format: double
        createdAt:
          type: integer
          format: int64

    SerialGroupListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SerialGroup"

    SerialGroupSerialsResponse:
      type: object
      properties:
        groupId:
          type: integer
          format: int64
        serials:
          type: array
          items:
            type: string

    UpdateSerialGroupRequest:
      type: object
      properties:
        description:
          type: string
          nullable: true
        score:
          type: integer
          minimum: 1
        category:
          type: string
          enum: [end_user_client, seller_to_end_user]
        warrantyMonths:
          type: integer
          nullable: true
          minimum: 1
        warrantyKm:
          type: integer
          nullable: true
          minimum: 1

    ExtendSerialGroupRangeRequest:
      type: object
      properties:
        addBelow:
          type: integer
          minimum: 1
          description: Add this many serial numbers below the current start
        addAbove:
          type: integer
          minimum: 1
          description: Add this many serial numbers above the current end
        newStart:
          type: integer
          minimum: 0
          description: Extend start down to this number (must be <= current start)
        newEnd:
          type: integer
          minimum: 0
          description: Extend end up to this number (must be >= current end)

    ExtendSerialGroupRangeResponse:
      type: object
      properties:
        inserted:
          type: integer
        skipped:
          type: integer
        startNumber:
          type: integer
        endNumber:
          type: integer
        group:
          $ref: "#/components/schemas/SerialGroup"

    DuplicateRangeItem:
      type: object
      properties:
        rangeLabel:
          type: string
        count:
          type: integer

    DuplicateSerialError:
      type: object
      properties:
        error:
          type: string
        duplicateCount:
          type: integer
        duplicateRanges:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateRangeItem"

    SerialRow:
      type: object
      properties:
        id:
          type: integer
          format: int64
        serial:
          type: string
        phone:
          type: string
        date:
          type: string
        city:
          type: string
        km:
          type: integer
        needsCompletion:
          type: boolean
        missingCity:
          type: boolean
        missingKm:
          type: boolean
        cityInherited:
          type: boolean
          description: True when city is shown from a prior registration for the same phone
        category:
          type: string
          enum: [end_user_client, seller_to_end_user]
          nullable: true
        completionReminderSent:
          type: boolean
        completionReminderSentAt:
          type: integer
          format: int64
          nullable: true
        registrationSource:
          type: string
          enum: [sms, rubika, telegram, bale]
          nullable: true
          description: Channel that registered the serial
        pairedRubika:
          type: boolean
        pairedTelegram:
          type: boolean
        pairedBale:
          type: boolean

    UpdateSerialRegistrationRequest:
      type: object
      required: [serial, date, phone]
      properties:
        serial:
          type: string
        date:
          type: string
          description: Jalali datetime e.g. 1404/03/30 14:35:22
        phone:
          type: string
          description: Iranian mobile e.g. 09121234567
        city:
          type: string
          nullable: true
        km:
          type: integer
          nullable: true

    SerialListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SerialRow"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    SmsProcessingSettings:
      type: object
      properties:
        mode:
          type: string
          enum: [SERIAL_ONLY, COMBINED_PATTERN, STEP_BY_STEP]
        separator:
          type: string
        combinedPattern:
          type: array
          items:
            type: string
            enum: [SERIAL, CITY, KM]
        stepFieldOrder:
          type: array
          items:
            type: string
            enum: [SERIAL, CITY, KM]
        stepFlowType:
          type: string
          enum: [SEQUENTIAL, COMBINED_SECOND]
        sessionTimeoutMinutes:
          type: integer

    SmsMessagePlaceholderHint:
      type: object
      properties:
        token:
          type: string
        labelFa:
          type: string

    SmsMessageDefinition:
      type: object
      properties:
        id:
          type: string
        categoryFa:
          type: string
        titleFa:
          type: string
        descriptionFa:
          type: string
        placeholders:
          type: array
          items:
            $ref: "#/components/schemas/SmsMessagePlaceholderHint"
        template:
          type: string

    SmsMessagesSettings:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/SmsMessageDefinition"

    CommunicationMessage:
      type: object
      properties:
        id:
          type: integer
          format: int64
        phone:
          type: string
        direction:
          type: string
          enum: [incoming, outgoing]
        body:
          type: string
        timestamp:
          type: integer
          format: int64
        status:
          type: string
          nullable: true
        simLabel:
          type: string
          nullable: true
        channel:
          type: string
          enum: [sms, rubika, telegram, bale]
          default: sms

    CommunicationSendRequest:
      type: object
      required: [phone, body, channels]
      properties:
        phone:
          type: string
        body:
          type: string
        channels:
          type: array
          items:
            type: string
            enum: [sms, rubika, telegram, bale]
          minItems: 1

    CommunicationSendChannelResult:
      type: object
      required: [channel, ok]
      properties:
        channel:
          type: string
          enum: [sms, rubika, telegram, bale]
        ok:
          type: boolean
        error:
          type: string
          nullable: true

    CommunicationSendResponse:
      type: object
      required: [phone, results]
      properties:
        phone:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/CommunicationSendChannelResult"

    CommunicationListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommunicationMessage"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    CommunicationThreadResponse:
      type: object
      properties:
        phone:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommunicationMessage"
        hasMore:
          type: boolean

    IranProvince:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        cities:
          type: array
          items:
            type: string

    IranProvinceListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IranProvince"

    MassSmsPreviewRequest:
      type: object
      required: [audienceType]
      properties:
        audienceType:
          type: string
          enum: [registered, error, all]
        provinceId:
          type: string
          nullable: true
        cityName:
          type: string
          nullable: true

    MassSmsPreviewResponse:
      type: object
      properties:
        count:
          type: integer
        samplePhones:
          type: array
          items:
            type: string

    MassSmsCreateRequest:
      type: object
      required: [message, audienceType]
      properties:
        message:
          type: string
        delaySeconds:
          type: integer
          default: 10
        audienceType:
          type: string
          enum: [registered, error, all]
        channel:
          type: string
          enum: [sms, rubika, telegram, bale]
          default: sms
        mediaAssetId:
          type: integer
          format: int64
          nullable: true
        provinceId:
          type: string
          nullable: true
        cityName:
          type: string
          nullable: true

    MassSmsMediaResponse:
      type: object
      properties:
        assetId:
          type: integer
          format: int64
        fileName:
          type: string
        mimeType:
          type: string
        kind:
          type: string
          enum: [photo, document]
        sizeBytes:
          type: integer
          format: int64

    MassSmsCampaign:
      type: object
      properties:
