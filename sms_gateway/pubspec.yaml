name: sms_gateway
description: Android SMS gateway that forwards messages to a PHP endpoint and replies.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  telephony: ^0.2.0
  flutter_background_service: ^5.1.0
  http: ^1.2.2
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
