<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: black;
        }
        .login-container {
            background-color: gray;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
        .form-label {
            font-weight: bold;
            color: yellow;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="login-container text-center">
            
            <form id="login-form">
                <div class="mb-3">
                    <label for="username" class="form-label">نام کاربری</label>
                    <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">رمز ورود</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-dark">ورود به پنل دکتر تک</button>
                <div id="error-message" class="text-danger mt-3" style="display: none;">رمز ورود یا نام کاربری اشتباه</div>
            </form>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $('#login-form').on('submit', function(event) {
                event.preventDefault();

                let username = $('#username').val();
                let password = $('#password').val();
                console.log(username);
                console.log(password);
                $.ajax({
                    url: 'login.php', // The PHP file that will process the login
                    type: 'POST',
                    data: {
                        username: username,
                        password: password
                    },
                    success: function(response) {
                        if (response == 'success') {
                            window.location.href = 'index.php'; // Redirect to index.html if login is successful
                        } else {
                            $('#error-message').show(); // Show error message if login fails
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>
