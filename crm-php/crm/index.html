<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ثبت تصویر سریال | دکتر تک</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/capture.css">
</head>
<body>
    <div class="min-vh-100 d-flex flex-column capture-page">
        <header class="header-dark py-2 shadow-sm">
            <div class="container">
                <div class="header-inner d-flex align-items-center justify-content-between gap-3">
                    <div class="header-logo-wrap d-flex align-items-center gap-0">
                        <img src="../assets/image/DrTech.png" alt="دکتر تک" class="header-logo">
                    </div>
                    <div class="header-text">
                        <div class="header-title-main">ثبت تصویر سریال</div>
                        <div class="header-title-sub text-end">تأیید تصویر برچسب گارانتی</div>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-grow-1 py-4">
            <div class="container">
                <div id="loadingState" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-3 text-muted">در حال بارگذاری...</p>
                </div>

                <div id="errorState" class="d-none">
                    <div class="alert alert-danger text-center" id="errorMessage"></div>
                </div>

                <div id="captureState" class="d-none">
                    <div class="card shadow rounded-4 overflow-hidden">
                        <div class="card-body p-4">
                            <p class="text-center mb-1 text-muted small">سریال شما</p>
                            <p class="text-center fw-bold fs-4 mb-4" id="serialDisplay">—</p>

                            <div class="camera-wrap position-relative mb-3">
                                <video id="cameraVideo" autoplay playsinline muted class="w-100 rounded-3"></video>
                                <canvas id="captureCanvas" class="d-none"></canvas>
                                <img id="previewImage" class="w-100 rounded-3 d-none" alt="پیش‌نمایش">
                                <div class="capture-guide rounded-3"></div>
                            </div>

                            <p class="small text-muted text-center mb-3">
                                برچسب سریال را داخل کادر قرار دهید و عکس بگیرید.
                            </p>

                            <div id="statusMessage" class="alert d-none mb-3" role="alert"></div>

                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-primary btn-lg" id="btnCapture">گرفتن عکس</button>
                                <button type="button" class="btn btn-outline-secondary d-none" id="btnRetake">عکس مجدد</button>
                                <button type="button" class="btn btn-success btn-lg d-none" id="btnSend">ارسال تصویر</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="successState" class="d-none">
                    <div class="alert alert-success text-center py-4">
                        <h5 class="mb-2">انجام شد</h5>
                        <p id="successMessage" class="mb-0"></p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="../assets/js/capture.js"></script>
</body>
</html>
